<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="10%" stop-color="#0a0a0f" />
      <stop offset="60%" stop-color="#050508" />
      <stop offset="100%" stop-color="#010203" />
    </radialGradient>

    <!-- Glowing magical circles -->
    <radialGradient id="amber-portal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cyan-portal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#0891b2" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Deep purple void pattern -->
    <radialGradient id="purple-nebula" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6b21a8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#4c1d95" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Golden linear gradient for circles -->
    <linearGradient id="gold-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid deep background -->
  <rect width="1000" height="1000" fill="url(#vignette)" />

  <!-- Ambient Nebulae -->
  <circle cx="500" cy="450" r="450" fill="url(#cyan-portal)" />
  <circle cx="300" cy="300" r="350" fill="url(#amber-portal)" />
  <circle cx="700" cy="650" r="400" fill="url(#purple-nebula)" />

  <!-- Sacred Alchemy Circles & Rings (Centred) -->
  <g transform="translate(500, 480)" filter="url(#soft-glow)">
    <!-- Outer Ritual Ring -->
    <circle r="280" fill="none" stroke="url(#gold-circle)" stroke-width="1.5" stroke-dasharray="10, 15" />
    <!-- Middle Ring -->
    <circle r="220" fill="none" stroke="#06b6d4" stroke-opacity="0.12" stroke-width="1" />
    <!-- Inner Octagram geometric design -->
    <polygon points="0,-160 113,-113 160,0 113,113 0,160 -113,113 -160,0 -113,-113" fill="none" stroke="#f59e0b" stroke-opacity="0.08" stroke-width="1" />
    <polygon points="0,-160 -113,-113 -160,0 -113,113 0,160 113,113 160,0 113,-113" fill="none" stroke="#06b6d4" stroke-opacity="0.06" stroke-width="0.8" />
    
    <!-- Central Sigil Core -->
    <circle r="80" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="2" />
    <circle r="40" fill="none" stroke="#fbbf24" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="2, 4" />
  </g>

  <!-- Glowing floating magic dust specs -->
  <circle cx="250" cy="200" r="3" fill="#fef08a" opacity="0.4" filter="url(#soft-glow)" />
  <circle cx="750" cy="280" r="4" fill="#06b6d4" opacity="0.3" filter="url(#soft-glow)" />
  <circle cx="150" cy="600" r="2.5" fill="#a855f7" opacity="0.3" filter="url(#soft-glow)" />
  <circle cx="850" cy="700" r="3.5" fill="#34d399" opacity="0.25" filter="url(#soft-glow)" />
  <circle cx="480" cy="850" r="4" fill="#f59e0b" opacity="0.35" filter="url(#soft-glow)" />
  <circle cx="620" cy="180" r="2" fill="#fff" opacity="0.5" />
</svg>
