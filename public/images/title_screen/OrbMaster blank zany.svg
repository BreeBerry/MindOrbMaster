<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="vignette-zany" cx="50%" cy="50%" r="75%">
      <stop offset="10%" stop-color="#0f051d" />
      <stop offset="50%" stop-color="#07020e" />
      <stop offset="100%" stop-color="#010005" />
    </radialGradient>

    <!-- Zany Bright Nebulae -->
    <radialGradient id="pink-burst" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3" />
      <stop offset="60%" stop-color="#db2777" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="neon-teal" cx="70%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#0d9488" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="royal-violet" cx="50%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#6d28d9" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Glowing magenta/teal strokes -->
    <linearGradient id="zany-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#2dd4bf" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hyper-glow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Solid deep background -->
  <rect width="1000" height="1000" fill="url(#vignette-zany)" />

  <!-- Ambient Nebulae -->
  <circle cx="350" cy="400" r="500" fill="url(#pink-burst)" />
  <circle cx="720" cy="650" r="450" fill="url(#neon-teal)" />
  <circle cx="500" cy="250" r="400" fill="url(#royal-violet)" />

  <!-- Sacred Geometry Spiral / Dynamic Lines -->
  <g transform="translate(500, 480)" filter="url(#hyper-glow)">
    <!-- Rotating geometric lines -->
    <circle r="320" fill="none" stroke="url(#zany-stroke)" stroke-width="2" stroke-dasharray="15, 8" />
    <circle r="260" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4, 12" />
    <circle r="190" fill="none" stroke="#f472b6" stroke-opacity="0.2" stroke-width="1" />
    
    <!-- Spiked Star Sigil of Orb Power -->
    <path d="M 0,-150 L 35,-35 L 150,0 L 35,35 L 0,150 L -35,35 L -150,0 L -35,-35 Z" fill="none" stroke="#f472b6" stroke-opacity="0.15" stroke-width="1.5" />
    <path d="M 0,-100 L 25,-25 L 100,0 L 25,25 L 0,100 L -25,25 L -100,0 L -25,-25 Z" fill="none" stroke="#2dd4bf" stroke-opacity="0.2" stroke-width="1" transform="rotate(45)" />

    <!-- Core portal boundary -->
    <circle r="60" fill="none" stroke="#fff" stroke-opacity="0.1" stroke-width="1" />
  </g>

  <!-- Electric sparks/stars -->
  <circle cx="200" cy="300" r="4" fill="#f472b6" opacity="0.6" filter="url(#hyper-glow)" />
  <circle cx="820" cy="220" r="3" fill="#a78bfa" opacity="0.5" filter="url(#hyper-glow)" />
  <circle cx="180" cy="720" r="5" fill="#2dd4bf" opacity="0.6" filter="url(#hyper-glow)" />
  <circle cx="840" cy="780" r="4" fill="#fbbf24" opacity="0.5" filter="url(#hyper-glow)" />
  <circle cx="530" cy="120" r="3" fill="#fff" opacity="0.7" />
  <circle cx="490" cy="880" r="4" fill="#f472b6" opacity="0.5" />
</svg>
