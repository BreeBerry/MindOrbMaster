<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <!-- Imports beautiful gothic/fantasy font -->
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&amp;family=Cinzel:wght@700;800;900&amp;display=swap');
      .title-orb {
        font-family: 'Cinzel Decorative', 'Cinzel', 'Georgia', serif;
        font-weight: 900;
        fill: url(#gold-gradient);
        filter: drop-shadow(0px 4px 12px rgba(245, 158, 11, 0.5)) drop-shadow(0px 8px 30px rgba(0, 0, 0, 0.9));
      }
      .title-master {
        font-family: 'Cinzel Decorative', 'Cinzel', 'Georgia', serif;
        font-weight: 900;
        fill: url(#silver-gradient);
        filter: drop-shadow(0px 4px 12px rgba(6, 182, 212, 0.4)) drop-shadow(0px 8px 30px rgba(0, 0, 0, 0.9));
        letter-spacing: 0.15em;
      }
      .runic-text {
        font-family: monospace;
        font-size: 10px;
        fill: #38bdf8;
        opacity: 0.8;
        letter-spacing: 0.4em;
      }
    </style>

    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="20%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#b45309" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Rich Silver/Cyan Metallic Gradient -->
    <linearGradient id="silver-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="70%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Magic Glowing Center Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background magical core behind the logo -->
  <circle cx="300" cy="110" r="75" fill="url(#core-glow)" opacity="0.6" filter="url(#glow)" />
  <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
    <stop offset="40%" stop-color="#a855f7" stop-opacity="0.3" />
    <stop offset="100%" stop-color="#000" stop-opacity="0" />
  </radialGradient>

  <!-- Sacred Geometry rings behind the titles -->
  <circle cx="300" cy="110" r="90" fill="none" stroke="#22d3ee" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="5,5" />
  <circle cx="300" cy="110" r="96" fill="none" stroke="#f59e0b" stroke-opacity="0.1" stroke-width="1" />

  <!-- Runic Text Arch or Accents -->
  <text x="300" y="45" text-anchor="middle" class="runic-text">ᛟ ᚱ ᛒ ᛘ ᚫ ᛋ ᛏ ᛖ ᚱ</text>

  <!-- Main "ORB" Title -->
  <text x="300" y="115" text-anchor="middle" font-size="72" class="title-orb">ORB</text>

  <!-- Subtitle "MASTER" -->
  <text x="305" y="170" text-anchor="middle" font-size="38" class="title-master">MASTER</text>

  <!-- Decorative horizontal underlines -->
  <line x1="180" y1="185" x2="420" y2="185" stroke="url(#gold-line)" stroke-width="2" opacity="0.8" />
  <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fbbf24" stop-opacity="0" />
    <stop offset="15%" stop-color="#fbbf24" stop-opacity="0.8" />
    <stop offset="50%" stop-color="#fff" stop-opacity="1" />
    <stop offset="85%" stop-color="#fbbf24" stop-opacity="0.8" />
    <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
  </linearGradient>
</svg>
